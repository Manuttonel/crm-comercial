<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home Financeiro – CRM Comercial</title>
  <!-- Fontes Jura (títulos) e Inter (textos) -->
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Visual compartilhado -->
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<!-- data-k diz ao app.js qual tela é esta (controle de acesso e item ativo do menu) -->
<body data-k="financeiro">
  <div id="app">
    <!-- Menu lateral: o app.js preenche o nome do usuário e os links conforme o perfil -->
    <aside class="side">
      <button class="hb" id="hb" aria-label="Recolher menu"><span></span><span></span><span></span></button>
      <b>“<span class="un">Usuário</span>”</b>
      <nav class="nav" id="nav"></nav>
      <button class="lo">Logout</button>
    </aside>
    <main>
      <!-- Home do financeiro: chargebacks, evolução do faturamento, faturamento total e ranking -->
      <section data-v="financeiro">
        <div class="card welcome">Bem vindo(a), “<span class="un">Financeiro</span>”!</div>
        <div class="fin">
          <div>
            <div class="card sel">
              <select id="fs" aria-label="Supervisor"></select>
              <select id="fl" aria-label="Lead"></select>
            </div>
            <div class="card pad2">
              <h2 style="text-align:left">Chargeback</h2>
              <div id="cbs"></div>
            </div>
            <div class="card pad2" style="flex:1">
              <h2 style="text-align:left">Evolução do faturamento</h2>
              <div id="evo"></div>
            </div>
          </div>
          <div>
            <div class="card pad2">
              <h2>Faturamento</h2>
              <div class="big-n" id="ft">R$ 0</div>
              <small id="ftSub"></small>
            </div>
            <div class="card pad2" style="flex:1">
              <div class="rkw" style="max-height:420px">
                <table class="rk">
                  <thead><tr><th>Ranking</th><th></th><th style="text-align:left">CONSULTOR</th><th>Faturamento</th><th>N° Vendas</th></tr></thead>
                  <tbody id="rk"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../../assets/js/dados.js"></script><!-- banco de dados no navegador -->
  <script src="../../assets/js/app.js"></script><!-- sessão, menu e funções compartilhadas -->
  <script src="script.js"></script><!-- lógica só desta tela -->
</body>
</html>
