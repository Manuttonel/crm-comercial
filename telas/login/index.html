<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login – CRM Comercial</title>
  <!-- Fontes Jura (títulos) e Inter (textos) -->
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Visual compartilhado -->
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
  <!-- Tela de login única para todos os setores (comercial, supervisão, gestão e financeiro) -->
  <section id="login">
    <span class="setor">CRM Comercial</span>
    <form id="lf">
      <div class="uav">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7z"/></svg>
      </div>
      <h1>User login</h1>
      <p class="sub">Entre com seu e-mail e senha</p>
      <label class="fld">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6l9 7 9-7"/></svg>
        <input id="em" type="email" placeholder="E-mail" required autocomplete="username">
      </label>
      <label class="fld">
        <svg class="i" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="pw" type="password" placeholder="Senha" required autocomplete="current-password">
      </label>
      <div class="opts">
        <label>
          <input type="checkbox" id="lb" checked>
          Lembrar
        </label>
        <button type="button" class="lnk" id="esq">Esqueceu a senha?</button>
      </div>
      <button class="go" type="submit">Login</button>
      <div id="err" role="alert"></div>
      <p class="troca">Não tem conta? <button type="button" class="lnk" id="irCad">Criar conta</button></p>
      <!-- Acessos de teste (trabalho acadêmico): clicar preenche o e-mail e a senha -->
      <details class="demo">
        <summary>Acessos de demonstração</summary>
        <div id="demo"></div>
        <button type="button" class="lnk" id="rst">Restaurar dados de exemplo</button>
      </details>
    </form>
    <!-- Cadastro de nova conta: aparece no lugar do login ao clicar em "Criar conta" -->
    <form id="cf" hidden>
      <div class="uav">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7z"/></svg>
      </div>
      <h1>Criar conta</h1>
      <p class="sub">Preencha seus dados para acessar o sistema</p>
      <label class="fld">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7"/></svg>
        <input id="cNome" placeholder="Nome completo" required autocomplete="name" maxlength="60">
      </label>
      <label class="fld">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6l9 7 9-7"/></svg>
        <input id="cEm" type="email" placeholder="E-mail" required autocomplete="email">
      </label>
      <label class="fld">
        <svg class="i" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="cPw" type="password" placeholder="Senha (mínimo 6 caracteres)" required minlength="6" autocomplete="new-password">
      </label>
      <label class="fld">
        <svg class="i" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="cPw2" type="password" placeholder="Confirmar senha" required autocomplete="new-password">
      </label>
      <label class="fld">
        <svg class="i" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="1"/><path d="M9 7V4h6v3"/></svg>
        <select id="cPf" required aria-label="Setor"></select>
      </label>
      <label class="fld" id="cEqL">
        <svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20c0-4 3-6 6-6s6 2 6 6M14 14c4 0 8 2 8 6"/></svg>
        <select id="cEq" aria-label="Equipe"></select>
      </label>
      <button class="go" type="submit">Criar conta</button>
      <div class="err" id="cErr" role="alert"></div>
      <p class="troca">Já tem conta? <button type="button" class="lnk" id="irLogin">Entrar</button></p>
    </form>
  </section>
  <script src="../../assets/js/dados.js"></script><!-- banco de dados no navegador -->
  <script src="../../assets/js/app.js"></script><!-- sessão e rotas -->
  <script src="script.js"></script><!-- validação do login -->
</body>
</html>
